[project]
name = "rowvision-worker"
version = "0.1.0"
description = "Takes clips from the queue and analyses them"
requires-python = ">=3.12,<3.13"
dependencies = ["rowvision", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rowvision_worker*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
packages = ["rowvision_worker"]
strict = true

[[tool.mypy.overrides]]
module = ["cv2.*", "rowvision.*", "certifi"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
omit = ["*/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
