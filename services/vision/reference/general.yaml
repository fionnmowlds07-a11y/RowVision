# General technique targets. See docs/research/README.md for evidence and limits.
# Ranges are RowVision's judgement from the cited values, not figures stated by any study.
# Each angle range is 5 degrees wide at most, so that a score separates good from very good. Finish
# layback is the one exception at 10: Olympic champions on hand-labelled frames sat at -30 to -39 (issue 269).
# Sources are PubMed IDs or links.

version: 1
status: provisional  # Not yet reviewed by a coach
angle_conventions:
  trunk_lean_deg: Hip-to-shoulder line from vertical. Forward towards the stern is positive.
  knee_deg: Inner angle at the knee. 180 is a straight leg.
  shin_deg: Ankle-to-knee line from vertical. Past vertical towards the stern is positive.
  drive_share: Drive time as a share of the full stroke cycle.

targets:
  catch_lean_deg:
    min: 26
    max: 31
    sources: ["39275598", "40708773"]
    evidence: ergometer
  finish_lean_deg:
    min: -30
    max: -20
    sources: ["39275598"]
    evidence: ergometer, widened to -30 by project judgement after elite on-water labels (issue 269)
  catch_knee_deg:
    min: 50
    max: 55
    sources: ["24146710", "40708773"]
    evidence: ergometer
  finish_knee_deg:
    min: 167
    max: 172
    sources: ["24146710", "40708773"]
    evidence: project judgement, near the studies' 167 to 169
    note: Legs are flat at the finish, but the knee never reads a full 180 as the thigh slopes down to the seat.
  catch_shin_deg:
    min: -2
    max: 2
    sources:
      - https://rowingcanada.org/uploads/2020/11/Canadian-Rowing-Model-Technique_FINAL.pdf
    evidence: coaching
    note: The source says shins perpendicular at full reach. The 2 degrees either side is project judgement.
  drive_share:
    by_rate_spm:
      22: 0.394
      26: 0.430
      32: 0.468
    tolerance: 0.05
    sources: ["37167317"]
    evidence: ergometer
  legs_lead:
    min: 0.0
    note: Direction only. A coaching principle, with no numeric target in the reviewed studies.
    sources:
      - https://rowingcanada.org/uploads/2020/11/Canadian-Rowing-Model-Technique_FINAL.pdf
      - https://www.britishrowing.org/knowledge/rower-development/british-rowing-technique/water-rowing-technique/
    evidence: coaching
