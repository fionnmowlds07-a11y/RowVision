# General technique targets. See docs/research/README.md for evidence and limits.
# Ranges are RowVision's judgement from the cited values, not figures stated by any study.
# Sources are PubMed IDs or links.

version: 1
status: provisional  # Not yet reviewed by a coach
angle_conventions:
  trunk_lean_deg: Hip-to-shoulder line from vertical. Forward towards the stern is positive.
  knee_deg: Inner angle at the knee. 180 is a straight leg.
  drive_share: Drive time as a share of the full stroke cycle.

targets:
  catch_lean_deg:
    min: 20
    max: 35
    sources: ["39275598", "40708773"]
    evidence: ergometer
  finish_lean_deg:
    min: -30
    max: -15
    sources: ["39275598"]
    evidence: ergometer
  catch_knee_deg:
    min: 45
    max: 60
    sources: ["24146710", "40708773"]
    evidence: ergometer
  finish_knee_deg:
    min: 160
    max: 170
    sources: ["24146710", "40708773"]
    evidence: ergometer
  drive_share:
    by_rate_spm:
      22: 0.394
      26: 0.430
      32: 0.468
    tolerance: 0.05
    sources: ["37167317"]
    evidence: ergometer
  legs_lead:
    min: 0.0
    note: Direction only. A coaching principle, with no numeric target in the reviewed studies.
    sources:
      - https://rowingcanada.org/uploads/2020/11/Canadian-Rowing-Model-Technique_FINAL.pdf
      - https://www.britishrowing.org/knowledge/rower-development/british-rowing-technique/water-rowing-technique/
    evidence: coaching
