[project]
name = "rowvision"
version = "0.1.0"
description = "Rowing biomechanics analysis pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.20,<2",
    "rtmlib>=0.0.13",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rowvision*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
