name: Installers

# Builds the Windows installer and the Linux AppImage. Heavy, so it runs only when asked for, on a
# version tag, or when this file or the installer settings change.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/scripts/**

jobs:
  installer:
    name: Installer on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle the engine
        run: |
          pip install ./services/vision ./services/worker pyinstaller
          # rtmlib brings a desktop build of OpenCV, which needs a display library we do not use.
          pip uninstall -y opencv-contrib-python opencv-python opencv-python-headless
          pip install "opencv-python-headless>=4.10,<5"
          pyinstaller --noconfirm --onedir --name rowvision-engine --exclude-module psycopg \
            --collect-all rtmlib --collect-all onnxruntime --collect-all cv2 \
            --collect-submodules rowvision --collect-submodules rowvision_worker \
            --add-data "services/vision/reference:reference" --add-data "services/vision/rowvision/*.py:rowvision" \
            services/worker/packaging/smoke.py
          mkdir -p apps/desktop/engine
          cp -r dist/rowvision-engine/. apps/desktop/engine/
      - name: Put ffmpeg beside it
        run: python apps/desktop/scripts/fetch-ffmpeg.py apps/desktop/engine

      - name: Build the installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist
          ls -lh release

      - name: The installed engine runs a job with no Python, and finds its own ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then unpacked=apps/desktop/release/linux-unpacked; else unpacked=apps/desktop/release/win-unpacked; fi
          engine="$PWD/$unpacked/resources/engine"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          test -x "$engine/rowvision-engine$ext"
          test -x "$engine/ffmpeg$ext"
          test -f "$PWD/$unpacked/resources/app.asar"
          # Make a tiny clip with the bundled ffmpeg, then run a job on it, with the engine's folder first on the path.
          work="$RUNNER_TEMP/clip"; mkdir -p "$work"
          "$engine/ffmpeg$ext" -v error -y -f lavfi -i testsrc=size=320x180:rate=30 -t 3 -pix_fmt yuv420p "$work/source.mp4"
          python -c "import json, sys; f, src, e = sys.argv[1:4]; json.dump(dict(folder=f, source=src, start=0, length=3, boat_class='2-', side='bow', seat=2, engine='fake'), open(f + '/job.json', 'w'))" "$work" "$work/source.mp4" "$engine"
          cd "$RUNNER_TEMP"
          PATH="$engine:/usr/bin:/bin" sleep 30 | PATH="$engine:/usr/bin:/bin" "$engine/rowvision-engine$ext" "$work/job.json" | tee events.txt
          grep -q '"event": "done"' events.txt
          test -s "$work/working.mp4"
          test -s "$work/summary.json"

      - name: Install what the installed-app test needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The sculler on the public site, saved under a name with accents, as a rower's own video might be.
      - name: Get a real clip
        run: |
          mkdir -p "$RUNNER_TEMP/Seán"
          curl -fsSL -o "$RUNNER_TEMP/Seán/Vídeo.mp4" https://downloads.rowvision.app/media/single-a.mp4

      - name: Start the app, let it download the real models, and analyse a real clip
        working-directory: apps/desktop
        env:
          CI: "1"
          PACKAGED_DATA_DIR: ${{ runner.temp }}/rowvision-data
          PACKAGED_CLIP: ${{ runner.temp }}/Seán/Vídeo.mp4
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:packaged
          else
            npm run test:packaged
          fi

      - name: The bundled engine loads the models the app downloaded, with no Python
        run: |
          unpacked=apps/desktop/release/$([ "$RUNNER_OS" = "Linux" ] && echo linux-unpacked || echo win-unpacked)
          engine="$PWD/$unpacked/resources/engine/rowvision-engine"
          [ "$RUNNER_OS" = "Windows" ] && engine="$engine.exe"
          cd "$RUNNER_TEMP"
          # With no arguments the bundle loads both models and runs each once. The folder named here is the app's own.
          # Nothing would be downloaded if they are all there, so a missing one would show up as a download, not a pass.
          models="$RUNNER_TEMP/rowvision-data/models/rtmlib"
          before=$(find "$models/hub/checkpoints" -type f | wc -l)
          TORCH_HOME="$models" PATH="$(dirname "$engine"):/usr/bin:/bin" "$engine"
          after=$(find "$models/hub/checkpoints" -type f | wc -l)
          test "$before" = "$after"

      - name: Analyse a real clip with the bundled engine, from a folder with accents in its name
        run: |
          unpacked=apps/desktop/release/$([ "$RUNNER_OS" = "Linux" ] && echo linux-unpacked || echo win-unpacked)
          python apps/desktop/scripts/check-installed.py "$unpacked/resources/engine" "$RUNNER_TEMP/rowvision-data/models/rtmlib"

      - name: Install it into a folder with accents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/RowVision-Setup-*.exe | Select-Object -First 1
          $target = Join-Path $env:LOCALAPPDATA "Programs\Seán\RowVision"
          # NSIS wants /D last, unquoted.
          Start-Process -Wait $setup.FullName -ArgumentList "/S", "/D=$target"
          foreach ($file in "RowVision.exe", "resources\app.asar", "resources\engine\rowvision-engine.exe", "resources\engine\ffmpeg.exe") {
            if (-not (Test-Path (Join-Path $target $file))) { Get-ChildItem -Recurse -Depth 2 (Join-Path $env:LOCALAPPDATA "Programs"); throw "$file was not installed" }
          }
          if (-not (Get-ChildItem -Recurse "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "RowVision*.lnk")) { throw "no Start menu entry" }
          "PACKAGED_APP_DIR=$target" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Analyse a real clip in the app as installed, and look at its results
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          CI: "1"
          PACKAGED_DATA_DIR: ${{ runner.temp }}/Seán/data
          PACKAGED_CLIP: ${{ runner.temp }}/Seán/Vídeo.mp4
          PACKAGED_SHOT: ${{ runner.temp }}/windows.png
        run: npm run test:packaged

      - name: Take it off again, keeping the clips
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $remove = Get-ChildItem $env:PACKAGED_APP_DIR -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -Wait $remove.FullName -ArgumentList "/S"
          foreach ($try in 1..30) { if (-not (Test-Path (Join-Path $env:PACKAGED_APP_DIR "RowVision.exe"))) { break }; Start-Sleep 2 }
          if (Test-Path (Join-Path $env:PACKAGED_APP_DIR "RowVision.exe")) { throw "it was not taken off" }
          if (-not (Get-ChildItem -Recurse "$env:RUNNER_TEMP\Seán\data\clips" -Filter summary.json)) { throw "the clips went too" }

      - uses: actions/upload-artifact@v4
        with:
          name: RowVision-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            ${{ runner.temp }}/windows.png
          retention-days: 7
          if-no-files-found: error
