name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  footage-guard:
    name: No footage in repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if video, image frames or keypoint data are tracked
        run: |
          found=$(git ls-files \
            | grep -Ei '\.(mp4|mov|m4v|avi|webm|mkv|hevc|npz|pkl|jpe?g|png|webp|heic|bmp|tiff?)$' \
            | grep -v '^apps/web/public/icons/' || true)
          if [ -n "$found" ]; then
            echo "Real footage must not be committed:"
            echo "$found"
            exit 1
          fi

  vision:
    name: Vision service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy rowvision
      - name: Unit and synthetic ground-truth tests
        run: pytest --cov=rowvision --cov-report=term --cov-fail-under=90

  preview:
    name: Preview page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e "../../services/vision[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Server tests
        run: pytest --cov=rowvision_preview --cov-report=term --cov-fail-under=90
      - name: Page tests
        run: node --test tests/logic.test.mjs
      - name: Check start script
        run: shellcheck start.sh

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/vision/pyproject.toml
            services/worker/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ../vision -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=rowvision_worker --cov-report=term --cov-fail-under=80

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Start the database
        run: npx supabase start --workdir ../.. -x studio,imgproxy,mailpit,postgres-meta
      - name: Security tests
        run: npx supabase test db --workdir ../..

  full-stack:
    name: Acceptance and browser tests
    runs-on: ubuntu-latest
    needs: [web, database, worker]
    defaults:
      run:
        working-directory: apps/web
    env:
      RETENTION_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/vision/pyproject.toml
            services/worker/pyproject.toml
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm ci
          pip install -e ../../services/vision -e ../../services/worker
      - name: Start the database
        run: npx supabase start --workdir ../.. -x studio,imgproxy,postgres-meta
      - name: Read the local keys
        run: |
          npx supabase status --workdir ../.. -o json > /tmp/supabase.json
          echo "SUPABASE_ANON_KEY=$(jq -r .ANON_KEY /tmp/supabase.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$(jq -r .SERVICE_ROLE_KEY /tmp/supabase.json)" >> "$GITHUB_ENV"
      - name: Build and start the web app
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          PORT=3100 HOSTNAME=127.0.0.1 SUPABASE_URL=http://127.0.0.1:54421 node .next/standalone/server.js &
      - name: Start the worker with the fake engine
        run: python -m rowvision_worker.main > /tmp/worker.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54422/postgres
          SUPABASE_URL: http://127.0.0.1:54421
          ROWVISION_ENGINE: fake
      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:3100/api/health?deep=1' && exit 0
            sleep 2
          done
          exit 1
      - name: Acceptance tests
        run: npm run test:acceptance
      - name: Browser tests
        run: npm run test:browser
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/worker.log
          retention-days: 7
