name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  footage-guard:
    name: No footage in repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if video, image frames or keypoint data are tracked
        run: |
          found=$(git ls-files \
            | grep -Ei '\.(mp4|mov|m4v|avi|webm|mkv|hevc|npz|pkl|jpe?g|png|webp|heic|bmp|tiff?)$' \
            | grep -v '^apps/web/public/icons/' || true)
          if [ -n "$found" ]; then
            echo "Real footage must not be committed:"
            echo "$found"
            exit 1
          fi

  vision:
    name: Vision service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy rowvision
      - name: Unit and synthetic ground-truth tests
        run: pytest --cov=rowvision --cov-report=term --cov-fail-under=90

  preview:
    name: Preview page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e "../../services/vision[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Server tests
        run: pytest --cov=rowvision_preview --cov-report=term --cov-fail-under=90
      - name: Page tests
        run: node --test tests/logic.test.mjs
      - name: Check start script
        run: shellcheck start.sh

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Start the database
        run: npx supabase start --workdir ../.. -x studio,imgproxy,mailpit,postgres-meta
      - name: Security tests
        run: npx supabase test db --workdir ../..
