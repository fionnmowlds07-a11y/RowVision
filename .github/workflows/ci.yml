name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  footage-guard:
    name: No footage in repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if video, image frames or keypoint data are tracked
        run: |
          found=$(git ls-files | grep -Ei '\.(mp4|mov|m4v|avi|webm|npz)$' || true)
          if [ -n "$found" ]; then
            echo "Real footage must not be committed:"
            echo "$found"
            exit 1
          fi

  vision:
    name: Vision service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy rowvision
      - name: Unit and synthetic ground-truth tests
        run: pytest --cov=rowvision --cov-report=term --cov-fail-under=90
