name: Engine bundle

# Pull requests are checked on Linux only. Windows costs double the Actions minutes, so it runs when
# started by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - services/vision/**
      - services/worker/**

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Linux we support, as a bundle only runs on systems as new as the one it was built on.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-22.04", "windows-latest"]') || fromJSON('["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine
        run: |
          pip install ./services/vision ./services/worker pyinstaller
          # rtmlib brings a desktop build of OpenCV, which needs a display library we do not use.
          pip uninstall -y opencv-contrib-python opencv-python opencv-python-headless
          pip install "opencv-python-headless>=4.10,<5"
      - name: Bundle it
        run: |
          pyinstaller --noconfirm --onedir --name rowvision-engine --exclude-module psycopg \
            --collect-all rtmlib --collect-all onnxruntime --collect-all cv2 \
            --collect-submodules rowvision --collect-submodules rowvision_worker \
            --add-data "services/vision/reference:reference" --add-data "services/vision/rowvision/*.py:rowvision" \
            services/worker/packaging/smoke.py
          du -sh dist/rowvision-engine
      - name: Run it from outside the repo, with no Python on the path
        run: |
          engine="$PWD/dist/rowvision-engine/rowvision-engine"
          cd "$RUNNER_TEMP"
          PATH="$(dirname "$engine"):/usr/bin:/bin" "$engine"
      - name: Run a job through the bundled command
        run: |
          engine="$PWD/dist/rowvision-engine/rowvision-engine"
          folder="$RUNNER_TEMP/clip"
          mkdir -p "$folder"
          echo video > "$folder/working.mp4"
          python -c "import json, sys; f = sys.argv[1]; json.dump(dict(fps=30, frames=240, width=1280, height=720), open(f + '/video.json', 'w')); json.dump(dict(folder=f, boat_class='2-', side='bow', seat=2, engine='fake'), open(f + '/job.json', 'w'))" "$folder"
          sleep 30 | "$engine" "$folder/job.json" | tee "$RUNNER_TEMP/events.txt"
          grep -q '"event": "done"' "$RUNNER_TEMP/events.txt"
          test -s "$folder/summary.json"
          test -s "$folder/frames.json"
