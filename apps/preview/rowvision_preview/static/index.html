<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RowVision preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>RowVision preview</h1>

    <form id="setup">
      <label>Clip <select id="clip" required></select></label>
      <label>Boat class <select id="boat-class" required></select></label>
      <label>Boats in the video <input id="boats" type="number" min="1" max="20" value="1" required></label>
      <label>Your seat <select id="seat" required></select></label>
      <button type="submit">Analyse</button>
    </form>
    <p id="form-error" class="error" role="alert" hidden></p>

    <section id="progress" hidden aria-live="polite">
      <p id="stage"></p>
      <progress id="bar" max="1"></progress>
      <button id="cancel" type="button">Cancel</button>
    </section>

    <p id="failed" class="error" role="alert" hidden></p>
    <p id="film-closer" class="banner" role="alert" hidden></p>
    <ul id="warnings" hidden></ul>

    <section id="picker" hidden>
      <h2>Tap your boat</h2>
      <p id="picker-note"></p>
      <button id="use-boat" type="button" disabled>Use this boat</button>
    </section>

    <div id="stage-area" hidden>
      <canvas id="canvas"></canvas>
    </div>

    <section id="viewer" hidden>
      <p id="summary"></p>
      <div id="timeline" role="presentation"><div id="cursor"></div></div>
      <p id="readout" aria-live="polite"></p>
      <div class="controls">
        <button type="button" data-jump="catches:-1" title="C with Shift">&#9664; Catch</button>
        <button type="button" data-jump="finishes:-1" title="F with Shift">&#9664; Finish</button>
        <button type="button" data-step="-10" title="Shift + Left">&minus;10</button>
        <button type="button" data-step="-1" title="Left arrow">&minus;1</button>
        <button type="button" data-step="1" title="Right arrow">+1</button>
        <button type="button" data-step="10" title="Shift + Right">+10</button>
        <button type="button" data-jump="finishes:1" title="F">Finish &#9654;</button>
        <button type="button" data-jump="catches:1" title="C">Catch &#9654;</button>
        <label class="toggle"><input id="show-lines" type="checkbox" checked> Limb lines</label>
      </div>
      <p class="hint">
        Keys: Left and Right step one frame, with Shift ten. C and F jump to the next catch or
        finish, with Shift the previous one. L hides the lines.
        <span class="key left">Left side</span> <span class="key right">right side</span>.
        Dashed lines are joints the model was unsure of.
      </p>
    </section>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
