# Runs beside the Supabase CLI stack, which `npm run db:start` in apps/web starts.
# Set SUPABASE_ANON_KEY and SUPABASE_SERVICE_KEY in a git-ignored .env file. `npm run db:status` prints them.
services:
  web:
    build: apps/web
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      SUPABASE_URL: http://host.docker.internal:54421
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54421
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set this in .env}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Set this in .env}
      RETENTION_SECRET: ${RETENTION_SECRET:-local-only}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health?deep=1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54422/postgres
      SUPABASE_URL: http://host.docker.internal:54421
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Set this in .env}
      SMTP_HOST: host.docker.internal
      SMTP_PORT: "54425"
      ROWVISION_ENGINE: ${ROWVISION_ENGINE:-real}
      HOME: /home/worker
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - models:/home/worker/.cache
    restart: unless-stopped

volumes:
  models:
